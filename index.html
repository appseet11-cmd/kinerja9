<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laporan Seluruh Kegiatan BK SMP 56 Jakarta</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#1a73e8,#0d47a1);min-height:100vh;color:#333}
#probeBanner{padding:12px 16px;font-size:14px;font-weight:600;text-align:center;font-family:Consolas,Monaco,monospace}
#probeBanner.ok{background:#137333;color:#fff}#probeBanner.bad{background:#c5221f;color:#fff}
#probeBanner.warn{background:#b06000;color:#fff}#probeBanner.load{background:#5f6368;color:#fff}
.header{background:#fff;padding:14px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.header h1{color:#1a73e8;font-size:20px;line-height:1.3}.header p{color:#666;margin-top:3px;font-size:12px}
.header .build{color:#999;font-size:10px;margin-top:2px;letter-spacing:.5px}
.container{max-width:1100px;margin:14px auto;padding:0 14px}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.15);margin-bottom:14px}
.login-box{text-align:center;padding:30px 16px}.login-box h2{color:#1a73e8;margin-bottom:16px}
.btn{display:inline-block;padding:10px 22px;margin:5px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;color:#fff}
.btn-guru{background:#34a853}.btn-kepsek{background:#ea4335}.btn-primary{background:#1a73e8}
.btn-secondary{background:#5f6368}.btn-warning{background:#f9ab00;color:#222}.btn-info{background:#00897b}
.btn:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.2)}.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-small{padding:6px 12px;font-size:12px}
/* ===== TOMBOL BERANDA - UNGU ELEKTRIK ===== */
.btn-beranda{background:#8B00FF}
.btn-beranda:hover{background:#9D2BFF;box-shadow:0 4px 12px rgba(139,0,255,.4)}
input[type=password],input[type=text]{padding:10px 14px;border:2px solid #ddd;border-radius:8px;font-size:14px;margin:6px}
input[type=text]{width:300px;max-width:90%}input:focus{border-color:#1a73e8;outline:none}
.info-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;background:#e8f0fe;padding:12px 16px;border-radius:8px;margin-bottom:14px}
.info-bar .who{font-weight:600;color:#1a73e8}
.versi{font-size:11px;background:#1a73e8;color:#fff;padding:2px 8px;border-radius:10px;margin-left:8px}
.search-box{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
table{width:100%;border-collapse:collapse;margin-top:8px}
th{background:#1a73e8;color:#fff;padding:9px;text-align:left;font-size:12px;white-space:nowrap}
td{padding:6px 9px;border-bottom:1px solid #eee;font-size:12px;vertical-align:top;max-width:320px;word-break:break-word}
tr:hover td{background:#f5f8ff}
.clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3;cursor:pointer}
.clip.open{-webkit-line-clamp:unset;display:block;overflow:visible}
.link-pdf{color:#1a73e8;text-decoration:none;font-weight:600;white-space:nowrap}.link-pdf:hover{text-decoration:underline}
.loader{display:inline-block;width:16px;height:16px;border:3px solid #ddd;border-top-color:#1a73e8;border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.alert{padding:12px 16px;border-radius:8px;margin:10px 0;font-size:13px;white-space:pre-line;word-break:break-word}
.alert-error{background:#fce8e6;color:#c5221f}.alert-success{background:#e6f4ea;color:#137333}
.alert-info{background:#e8f0fe;color:#1a73e8}.alert-warn{background:#fef7e0;color:#b06000}
.hidden{display:none}
.sheet-block{border:2px solid #e0e0e0;border-radius:10px;margin-bottom:16px;overflow:hidden}
.sheet-header{background:#1a73e8;color:#fff;padding:11px 16px;font-weight:600;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.sheet-body{padding:14px;overflow-x:auto}
.nis-highlight{background:#fff3cd;padding:2px 6px;border-radius:4px;font-weight:600}
.badge{background:#f9ab00;color:#222;padding:2px 7px;border-radius:4px;font-size:11px;margin-left:6px}
.mono{font-family:Consolas,Monaco,'Courier New',monospace;font-size:12px}.muted{color:#888;font-size:13px}
</style>
</head>
<body>
<div id="probeBanner" class="load">⏳ Menguji koneksi ke backend…</div>
<div class="header"><h1>📋 Laporan Seluruh Kegiatan BK</h1><p>SMP Negeri 56 Jakarta</p><div class="build">BUILD-HTML-5.0</div></div>
<div class="container">
<div id="loginScreen" class="card login-box">
<h2>Silakan Login</h2><p class="muted" style="margin-bottom:16px">Pilih peran Anda untuk mengakses laporan</p>
<div><button class="btn btn-guru" onclick="showLogin('gurubk')">‍🏫 Guru BK</button><button class="btn btn-kepsek" onclick="showLogin('kepsek')">👔 Kepala Sekolah</button></div>
<div id="passwordBox" class="hidden" style="margin-top:20px">
<p id="roleLabel" style="font-weight:600;color:#1a73e8;margin-bottom:8px"></p>
<input type="password" id="passwordInput" placeholder="Masukkan password" onkeypress="if(event.key==='Enter')doLogin()"><br>
<button class="btn btn-primary" onclick="doLogin()">Masuk</button><button class="btn btn-secondary" onclick="cancelLogin()">Batal</button>
<div id="loginAlert"></div>
</div>
</div>
<div id="dashboard" class="hidden">
<div class="info-bar">
<div>👤 <span class="who" id="roleDisplay"></span><span class="versi" id="versiLabel">v?</span></div>
<div>
<!-- ===== TOMBOL BERANDA (UNGUELEKTRIK) ===== -->
<button class="btn btn-beranda btn-small" onclick="goBeranda()">🏠 Beranda</button>
<button class="btn btn-info btn-small" onclick="testPing()">🧪 Tes Koneksi</button>
<button class="btn btn-warning btn-small" onclick="doRekap()">🔄 Rekap Ulang</button>
<button class="btn btn-info btn-small" onclick="doDiagnosa()">🩺 Diagnosa</button>
<button class="btn btn-primary btn-small" onclick="doDebug()">🔍 Debug Mapping</button>
<button class="btn btn-secondary btn-small" onclick="logout()">🚪 Logout</button>
</div>
</div>
<div class="card">
<h3 style="color:#1a73e8;margin-bottom:14px"> Cari Laporan (NIS / Nama Siswa)</h3>
<div class="search-box">
<input type="text" id="nisInput" placeholder="Ketik NIS atau nama siswa" onkeypress="if(event.key==='Enter')cariNIS()">
<button class="btn btn-primary" onclick="cariNIS()">🔎 Cari</button>
<button class="btn btn-secondary" onclick="tampilkanSemua()">📚 Tampilkan Semua</button>
</div>
<div id="loaderCari"></div><div id="hasilCari"></div>
</div>
</div>
</div>
<script>
/* ============================================================
ISI URL INI dengan URL /exec dari deploy Apps Script Anda.
Contoh: https://script.google.com/macros/s/AKfycbxxxx/exec
============================================================ */
var API_URL = 'https://script.google.com/macros/s/AKfycbyioGQJvaDkhsK8JpSwSqhHYlOKtw7HrStqpVoPNrfpajoLNMgJCh3eKnGHCEamFgEtDw/exec';

/* ============================================================
🏠 URL TUJUAN TOMBOL BERANDA
Ganti URL di bawah ini dengan link halaman beranda Anda.
Contoh: 'beranda.html' atau 'https://situsanda.com/beranda'
============================================================ */
var BERANDA_URL = 'https://appseet11-cmd.github.io/New-BK56/';
/* ============================================================ */

var currentRole=null, selectedRole=null;
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escAttr(s){return esc(s).replace(/"/g,'&quot;');}
document.addEventListener('click', function(ev){ var t=ev.target.closest ? ev.target.closest('.clip') : null; if(t){ t.classList.toggle('open'); } });

/* ===== FUNGSI TOMBOL BERANDA ===== */
function goBeranda(){
if(!BERANDA_URL || BERANDA_URL.trim()===''){
alert('⚠️ URL Beranda belum disematkan! Silakan edit variabel BERANDA_URL di script.');
return;
}
window.location.href = BERANDA_URL;
}

/* ===== JSONP caller (bebas CORS => bisa double-click file ini) ===== */
function jsonp(action, params, timeout){
return new Promise(function(resolve,reject){
if(!API_URL || API_URL.indexOf('GANTI_DENGAN')===0){ reject(new Error('API_URL belum diisi di index.html (baris var API_URL).')); return; }
params=params||{}; timeout=timeout||30000;
var cb='__jp'+Math.random().toString(36).slice(2)+Date.now().toString(36);
var q=''; for(var k in params){ q+='&'+encodeURIComponent(k)+'='+encodeURIComponent(params[k]); }
var url=API_URL+'?callback='+cb+'&action='+encodeURIComponent(action)+q;
var s=document.createElement('script'); var done=false;
function cleanup(){ done=true; clearTimeout(to); if(s.parentNode)s.parentNode.removeChild(s); try{delete window[cb];}catch(_){window[cb]=undefined;} }
var to=setTimeout(function(){ if(!done){ cleanup(); reject(new Error('Waktu habis (timeout '+timeout+'ms). Backend mungkin sibuk/slow.')); } }, timeout);
window[cb]=function(data){ if(done)return; cleanup(); resolve(data); };
s.onerror=function(){ if(done)return; cleanup(); reject(new Error('Gagal memuat API. Cek: API_URL benar? Apps Script sudah deploy "Anyone"? Internet OK?')); };
s.src=url; document.head.appendChild(s);
});
}
/* ===== AUTO-PROBE saat halaman dibuka ===== */
window.addEventListener('load', function(){
var b=document.getElementById('probeBanner');
jsonp('ping',{},15000).then(function(r){
if(r && r.success){ b.className='ok'; b.textContent='🟢 BACKEND v'+(r.versi||'?')+' HIDUP — '+r.message+' — silakan login & gunakan.'; }
else { b.className='warn'; b.textContent='🟡 Backend merespons tak terduga: '+JSON.stringify(r); }
}).catch(function(e){
b.className='bad'; b.textContent='🔴 '+e.message;
});
});
/* ===== LOGIN ===== */
function showLogin(role){ selectedRole=role;
document.getElementById('roleLabel').innerText=(role==='gurubk')?'‍🏫 Login Guru BK':' Login Kepala Sekolah';
document.getElementById('passwordBox').classList.remove('hidden');
document.getElementById('passwordInput').value=''; document.getElementById('passwordInput').focus();
document.getElementById('loginAlert').innerHTML='';
}
function cancelLogin(){ document.getElementById('passwordBox').classList.add('hidden'); selectedRole=null; }
function doLogin(){
var pwd=document.getElementById('passwordInput').value, ab=document.getElementById('loginAlert');
if(!pwd){ ab.innerHTML='<div class="alert alert-error">Password wajib diisi!</div>'; return; }
ab.innerHTML='<div class="loader"></div>Memverifikasi...';
jsonp('login',{role:selectedRole,password:pwd},20000).then(function(res){
if(res&&res.success){ currentRole=res.role;
document.getElementById('loginScreen').classList.add('hidden');
document.getElementById('dashboard').classList.remove('hidden');
document.getElementById('roleDisplay').innerText=currentRole;
document.getElementById('versiLabel').innerText='v'+(res.versi||'?');
} else { ab.innerHTML='<div class="alert alert-error">'+esc((res&&res.message)||'Login gagal.')+'</div>'; }
}).catch(function(e){ ab.innerHTML='<div class="alert alert-error mono">❌ '+esc(e.message)+'</div>'; });
}
function logout(){ currentRole=null;
document.getElementById('dashboard').classList.add('hidden');
document.getElementById('loginScreen').classList.remove('hidden');
document.getElementById('passwordBox').classList.add('hidden');
document.getElementById('hasilCari').innerHTML=''; document.getElementById('nisInput').value='';
}
/* ===== TES KONEKSI ===== */
function testPing(){ var h=document.getElementById('hasilCari'),l=document.getElementById('loaderCari');
l.innerHTML='<div class="loader"></div>Menguji...'; h.innerHTML='';
jsonp('ping',{},15000).then(function(res){ l.innerHTML='';
if(!res){ h.innerHTML='<div class="alert alert-warn mono">️ ping kosong.</div>'; return; }
h.innerHTML='<div class="alert '+(res.success?'alert-success':'alert-error')+' mono">✅ Backend hidup.<br>versi : '+esc(res.versi)+'<br>waktu : '+esc(res.waktu)+'<br>pesan : '+esc(res.message)+'</div>';
}).catch(function(e){ l.innerHTML=''; h.innerHTML='<div class="alert alert-error mono">❌ '+esc(e.message)+'</div>'; });
}
/* ===== REKAP (timeout panjang) ===== */
function doRekap(){ if(!confirm('Rekap ulang? (Sheet "(2)" dibersihkan otomatis.)'))return;
var b=event.target,old=b.innerHTML; b.disabled=true; b.innerHTML='<div class="loader"></div>Memproses...';
jsonp('rekap',{},120000).then(function(res){ b.disabled=false; b.innerHTML=old;
var box=document.getElementById('hasilCari');
if(!res){ box.innerHTML='<div class="alert alert-error">Backend kosong.</div>'; return; }
box.innerHTML='<div class="alert '+(res.success?'alert-success':'alert-error')+' mono">'+esc(res.message)+'</div>';
}).catch(function(e){ b.disabled=false; b.innerHTML=old; document.getElementById('hasilCari').innerHTML='<div class="alert alert-error mono">❌ '+esc(e.message)+'</div>'; });
}
/* ===== DEBUG MAPPING ===== */
function doDebug(){ var h=document.getElementById('hasilCari'),l=document.getElementById('loaderCari');
l.innerHTML='<div class="loader"></div>Cek MAPPING...'; h.innerHTML='';
jsonp('mapping',{},30000).then(function(res){ l.innerHTML='';
if(!res){ h.innerHTML='<div class="alert alert-error">Backend kosong.</div>'; return; }
h.innerHTML='<div class="alert '+(res.success?'alert-success':'alert-error')+' mono">'+esc(res.message)+'</div>';
}).catch(function(e){ l.innerHTML=''; h.innerHTML='<div class="alert alert-error mono">❌ '+esc(e.message)+'</div>'; });
}
/* ===== DIAGNOSA ===== */
function doDiagnosa(){ var h=document.getElementById('hasilCari'),l=document.getElementById('loaderCari');
l.innerHTML='<div class="loader"></div>Menyusun diagnosa...'; h.innerHTML='';
jsonp('diagnosa',{},30000).then(function(res){ l.innerHTML='';
if(!res){ h.innerHTML='<div class="alert alert-error">Backend kosong.</div>'; return; }
h.innerHTML='<div class="alert '+(res.success?'alert-success':'alert-error')+' mono">'+esc(res.message)+'</div>';
}).catch(function(e){ l.innerHTML=''; h.innerHTML='<div class="alert alert-error mono">❌ '+esc(e.message)+'</div>'; });
}
/* ===== RENDER ===== */
function renderHasil(arr){ if(!arr||arr.length===0)return''; var html='';
for(var k=0;k<arr.length;k++){ var it=arr[k], rows=it.rows||[], heads=it.headers||[];
var badge=(it.mode==='contains')?'<span class="badge">match sebagian</span>':'';
html+='<div class="sheet-block"><div class="sheet-header"><span> '+esc(it.namaSheet)+badge+'</span><span>'+rows.length+' baris</span></div><div class="sheet-body">';
if(heads.length===0){ html+='<p class="muted">Sheet kosong.</p>'; }
else if(rows.length===0){ html+='<p class="muted">Tidak ada baris cocok.</p>'; }
else { html+='<table><thead><tr>'; for(var c=0;c<heads.length;c++)html+='<th>'+esc(heads[c])+'</th>'; html+='</tr></thead><tbody>';
for(var r=0;r<rows.length;r++){ html+='<tr>'; var row=rows[r];
for(var i=0;i<heads.length;i++){ var cell=(i<row.length)?row[i]:''; var s=String(cell==null?'':cell);
var isPDF=(i===it.idxPDF)&&/^https?:\/\//i.test(s); var isNIS=(i===it.idxNIS); var inner;
if(isPDF){ inner='<a class="link-pdf" href="'+escAttr(s)+'" target="_blank">📎 PDF</a>'; }
else { inner=esc(s); if(isNIS) inner='<span class="nis-highlight">'+inner+'</span>';
inner='<span class="clip" title="'+escAttr(s)+'">'+inner+'</span>'; }
html+='<td>'+inner+'</td>'; }
html+='</tr>'; } html+='</tbody></table>'; }
html+='</div></div>'; }
return html;
}
/* ===== CARI ===== */
function cariNIS(){ var v=document.getElementById('nisInput').value.trim();
var l=document.getElementById('loaderCari'),h=document.getElementById('hasilCari');
if(!v){ h.innerHTML='<div class="alert alert-error">Isi NIS / nama dulu!</div>'; return; }
l.innerHTML='<div class="loader"></div>Mencari...'; h.innerHTML='';
jsonp('cari',{nis:v},30000).then(function(res){ l.innerHTML='';
if(!res){ h.innerHTML='<div class="alert alert-error">Backend kosong.</div>'; return; }
if(!res.success){ h.innerHTML='<div class="alert alert-error">'+esc(res.message)+'</div>'; return; }
if(!res.found){ h.innerHTML='<div class="alert alert-info">️ '+esc(res.message)+'</div>'; return; }
h.innerHTML='<div class="alert alert-success">✅ Ditemukan untuk "<b>'+esc(res.nis)+'</b>" di '+res.data.length+' laporan:</div>'+renderHasil(res.data);
}).catch(function(e){ l.innerHTML=''; h.innerHTML='<div class="alert alert-error mono">❌ '+esc(e.message)+'</div>'; });
}
/* ===== TAMPILKAN SEMUA (hanya sheet berisi data) ===== */
function tampilkanSemua(){ var l=document.getElementById('loaderCari'),h=document.getElementById('hasilCari');
l.innerHTML='<div class="loader"></div>Memuat semua data...'; h.innerHTML='';
jsonp('semua',{},60000).then(function(res){ l.innerHTML='';
if(!res){ h.innerHTML='<div class="alert alert-error">Backend kosong.</div>'; return; }
if(!res.success){ h.innerHTML='<div class="alert alert-error">'+esc(res.message)+'</div>'; return; }
if(!res.data||res.data.length===0){ h.innerHTML='<div class="alert alert-info">'+esc(res.message||'Belum ada laporan yang berisi data. Isi sheet sumber, lalu klik Rekap Ulang.')+'</div>'; return; }
var infoKosong = res.kosongDilewati ? ' <span class="muted">(️ '+res.kosongDilewati+' sheet kosong tidak ditampilkan)</span>' : '';
h.innerHTML='<div class="alert alert-success">📚 Menampilkan <b>'+res.data.length+'</b> sheet laporan yang berisi data.'+infoKosong+'</div>'+renderHasil(res.data);
}).catch(function(e){ l.innerHTML=''; h.innerHTML='<div class="alert alert-error mono">❌ '+esc(e.message)+'</div>'; });
}
</script>
</body>
</html>
